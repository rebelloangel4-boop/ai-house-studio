name: AI HOUSE Pilot Render
on:
  push:
    branches: [main]
    paths: ['studio/**', 'episodes/001.json', '.github/workflows/pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-house-pilot
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow==11.1.0 numpy==2.2.3 soundfile==0.13.1 kokoro==0.9.4
      - name: Render pilot for review only
        run: python studio/render.py --episode 001
      - name: Technical quality gate
        run: python studio/verify.py output/001
      - name: Report result
        if: always()
        run: |
          echo '## AI HOUSE pilot test' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publishing is disabled. Technical success does not equal creative approval.' >> "$GITHUB_STEP_SUMMARY"
          if test -f output/001/qa.json; then cat output/001/qa.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-house-pilot-001-v2
          path: output/001/
          retention-days: 2
          if-no-files-found: error
