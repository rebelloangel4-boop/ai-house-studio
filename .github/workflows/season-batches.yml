name: AI HOUSE Four-Day Season Production
on:
  schedule:
    - cron: '30 2 20-23 10 *'
  workflow_dispatch:
    inputs:
      batch_date:
        description: 'IST batch date (2026-10-20, 21, 22, or 23)'
        required: false
permissions:
  contents: read
  actions: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      episodes: ${{ steps.pick.outputs.episodes }}
      active: ${{ steps.pick.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          BATCH_DATE: ${{ inputs.batch_date }}
        run: python production/season_batch.py
  render:
    needs: select
    if: needs.select.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        episode: ${{ fromJSON(needs.select.outputs.episodes) }}
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow==11.1.0 numpy==2.2.3 soundfile==0.13.1 kokoro==0.9.4
      - name: Render and verify episode
        run: |
          python production/generate_season.py
          python studio/render.py --episode "${{ matrix.episode }}"
          python studio/verify.py "output/${{ matrix.episode }}"
          python production/episode_metadata.py "${{ matrix.episode }}" "output/${{ matrix.episode }}"
      - name: Save review-only MP4 and metadata
        uses: actions/upload-artifact@v4
        with:
          name: ai-house-season-${{ matrix.episode }}
          path: output/${{ matrix.episode }}/
          retention-days: 8
          if-no-files-found: error
      - name: Upload direct MP4 and matching metadata to Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: '1Uf-geoBfWQPpRCqLfQdbGnx74DDdhb4o'
        run: |
          if [ -n "$GDRIVE_CLIENT_ID" ] && [ -n "$GDRIVE_CLIENT_SECRET" ] && [ -n "$GDRIVE_REFRESH_TOKEN" ]; then
            python production/upload_direct_mp4.py "output/${{ matrix.episode }}"
          else
            echo "::warning::Drive OAuth secrets missing; MP4 is retained in GitHub artifact but not delivered to Drive."
          fi
