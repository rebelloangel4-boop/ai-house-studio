name: AI HOUSE Controlled Season Production
on:
  workflow_dispatch:
    inputs:
      batch_date:
        description: 'IST batch date (2026-10-20, 21, 22, or 23)'
        required: false
permissions:
  contents: write
  actions: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      episodes: ${{ steps.pick.outputs.episodes }}
      active: ${{ steps.pick.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          BATCH_DATE: ${{ inputs.batch_date }}
        run: python production/season_batch.py
  render:
    needs: select
    if: needs.select.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        episode: ${{ fromJSON(needs.select.outputs.episodes) }}
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r production/voice-requirements.txt
      - name: Render and verify episode
        run: |
          python production/generate_season.py
          python studio/render.py --episode "${{ matrix.episode }}"
          python studio/verify.py "output/${{ matrix.episode }}"
          python production/episode_metadata.py "${{ matrix.episode }}" "output/${{ matrix.episode }}"
      - name: Save review-only MP4 and metadata
        uses: actions/upload-artifact@v4
        with:
          name: ai-house-season-${{ matrix.episode }}
          path: output/${{ matrix.episode }}/
          retention-days: 8
          if-no-files-found: error
      - name: Retain individual MP4 in private draft review
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ matrix.episode }}
        run: |
          TAG="season-review-${GITHUB_RUN_ID}-${EPISODE}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "AI HOUSE Episode ${EPISODE} review" --notes "Technical verification passed. Voice listening and creative approval pending. No social publishing or Drive delivery."
          gh release upload "$TAG" "output/$EPISODE/episode_$EPISODE.mp4" "output/$EPISODE/episode_${EPISODE}_upload.txt" --clobber
