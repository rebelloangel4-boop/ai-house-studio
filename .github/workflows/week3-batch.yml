name: AI HOUSE Week 3 Review Batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/week3-batch.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-house-controlled-production
  cancel-in-progress: false
jobs:
  week3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r production/voice-requirements.txt
      - name: Restore successful scenes
        run: |
          python production/restore_pack.py week-003
      - name: Render sequentially and verify Week 3
        run: python production/render_pack.py --pack week-003
      - name: Retain individual verified MP4s for review
        if: always()
        run: |
          python production/retain_pack.py week-003
      - name: Keep dry voices and recovery checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-house-week-003-checkpoint
          path: |
            output/
            .voice-cache/
          include-hidden-files: true
          retention-days: 8
          if-no-files-found: warn

# Repair nursery wording and pizza transition; reuse successful checkpoints.
